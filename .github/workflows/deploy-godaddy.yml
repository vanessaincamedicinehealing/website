name: Deploy to GoDaddy

# On every push to main, uploads the .html pages, styles.css, script.js, robots.txt, sitemap.xml and assets/ to GoDaddy over SFTP.
# Needs repository secrets SFTP_USERNAME and SFTP_PASSWORD (see README).
# It never deletes anything and only uploads into a folder that holds both index.html and wp-config.php.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-godaddy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_SERVER: 1329909.us21.ssh.myftpupload.com
      # The server's public SSH host key, so the upload refuses to talk to an impostor.
      SFTP_HOST_KEY: 1329909.us21.ssh.myftpupload.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILwQwncFCRpxxYViJR+ogl8E73kt/A2c+4QA7q9Qd5r4
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
    steps:
      - name: Check out
        if: env.SFTP_USERNAME != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Upload
        if: env.SFTP_USERNAME != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p ~/.ssh && echo "$SFTP_HOST_KEY" > ~/.ssh/known_hosts
          sftp() { lftp -c "set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes'; set net:max-retries 2; set net:timeout 30; open --env-password -u \"$SFTP_USERNAME\" sftp://$SFTP_SERVER; $1"; }

          # Find the web root: the folder holding both index.html and wp-config.php.
          root=""
          for d in . html; do
            files=$(sftp "cls -1 '$d/'" 2>/dev/null | xargs -rn1 basename || true)
            if grep -qx index.html <<<"$files" && grep -qx wp-config.php <<<"$files"; then root="$d"; break; fi
          done
          [ -n "$root" ] || { echo "::error::Couldn't find the web root (a folder with index.html and wp-config.php)."; exit 1; }
          echo "Uploading to '$root'"

          # Version the CSS/JS links so browsers fetch new copies (GoDaddy tells them to cache for 31 days).
          v="${GITHUB_SHA::8}"
          sed -i -e "s|href=\"styles.css\"|href=\"styles.css?v=$v\"|" -e "s|src=\"script.js\"|src=\"script.js?v=$v\"|" *.html

          sftp "cd '$root'; put styles.css; put script.js; put robots.txt; put sitemap.xml; mirror -R --no-perms --parallel=4 --exclude-glob '*.png' assets assets; mput *.html"
          echo "::notice::Uploaded. Now flush the cache in GoDaddy: Hosting Settings > Flush Cache > Flush Now."
